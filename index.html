
<!DOCTYPE html>
<html>
<head>
    <title>Static Methods in JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 420px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 80%;
            box-sizing: border-box;
        }

        button {
            background-color: #4f46e5;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            font-size: 18px;
            color: #3730a3;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Static Method Calculator</h2>

        <input type="number" id="num1"
               placeholder="Enter first number">

        <br>

        <input type="number" id="num2"
               placeholder="Enter second number">

        <br>

        <button onclick="calculateSum()">Add Numbers</button>

        <p id="result"></p>
    </div>

    <script>
        // Define a class
        class Calculator {

            // Define a static method
            static add(a, b) {
                return a + b;
            }
        }

        function calculateSum() {
            const firstInput = document.getElementById("num1").value;
            const secondInput = document.getElementById("num2").value;

            if (firstInput === "" || secondInput === "") {
                document.getElementById("result").textContent =
                    "Please enter both numbers.";
                return;
            }

            const num1 = Number(firstInput);
            const num2 = Number(secondInput);

            // Call the static method using the class name
            const sum = Calculator.add(num1, num2);

            document.getElementById("result").textContent =
                "Sum: " + sum;
        }
    </script>

</body>
</html>
